name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'preview-*'

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          archives: qtbase qttools qtimageformats qtsvg
          source: true
          src-archives: qtbase qtimageformats qtsvg
          cache: true
      - name: Build, test and package
        shell: pwsh
        run: ./packaging/windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QLaue-windows-x64
          path: dist/installers/*
          if-no-files-found: error
      - name: Keep regression and installer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-validation
          path: |
            build-print_alignment/output/
            build-installer-check/*.log
          if-no-files-found: ignore
